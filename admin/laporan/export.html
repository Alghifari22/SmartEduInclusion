<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Data - Admin</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../sidebar.css">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">SmartEduInclusion</div>
            <div class="logo-subtitle">Admin Portal</div>
        </div>

        <nav class="sidebar-nav">
            <ul class="nav-list">
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <i class="fas fa-home"></i>
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <i class="fas fa-users"></i>
                        Manajemen Pengguna
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../Manajemen kelas/index.html" class="nav-link">
                        <i class="fas fa-school"></i>
                        Manajemen Data Kelas
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link active">
                        <i class="fas fa-file-alt"></i>
                        Laporan Inklusif
                    </a>
                </li>
            </ul>
        </nav>

        <div class="sidebar-footer">
            <button class="logout-btn" id="logout-btn">
                <i class="fas fa-sign-out-alt"></i>
                Logout
            </button>
        </div>
    </aside>

    <main class="main-content">
        <!-- Top Header -->
        <header class="top-header">
            <h1 class="header-title">Laporan Inklusif</h1>
            <div class="user-info">
                <div class="user-details">
                    <span class="user-name">Admin</span>
                    <span class="user-email">admin@smartedu.com</span>
                </div>
                <div class="user-avatar">
                    AD
                </div>
            </div>
        </header>

        <div class="content-wrapper">

            <div class="export-card">
                <div class="export-icon">
                    <i class="fa-solid fa-file-arrow-down"></i>
                </div>
                <h3>Unduh Laporan Inklusif</h3>
                <p style="color: #64748b; margin-bottom: 30px;">Pilih format dan periode data yang ingin Anda unduh.</p>
    
                <form>
                    <div class="form-group">
                        <label>Pilih Kelas</label>
                        <select class="form-select">
                            <option>Semua Kelas</option>
                            <option>Kelas 10</option>
                            <option>Kelas 11</option>
                            <option>Kelas 12</option>
                        </select>
                    </div>
    
                    <div class="form-group">
                        <label>Periode Laporan</label>
                        <input type="date" class="form-date">
                    </div>
    
                    <div class="form-group">
                        <label>Format File</label>
                        <select class="form-select">
                            <option value="pdf">PDF Document (.pdf)</option>
                            <option value="excel">Microsoft Excel (.xlsx)</option>
                            <option value="csv">CSV (.csv)</option>
                        </select>
                    </div>
    
                    <div class="btn-group">
                        <button type="button" class="btn-outline" onclick="window.location.href='index.html'">Batal</button>
                        <button type="button" class="btn-primary" onclick="alert('Laporan sedang diunduh...')">Download
                            Sekarang</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
