<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Kelas - SmartEdu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../sidebar.css">
</head>
<body class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">SmartEduInclusion</div>
            <div class="logo-subtitle">Admin Portal</div>
        </div>

        <nav class="sidebar-nav">
           <ul class="nav-list">
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <i class="fas fa-home"></i>
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <i class="fas fa-users"></i>
                        Manajemen Pengguna
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../Manajemen kelas/index.html" class="nav-link active">
                        <i class="fas fa-school"></i>
                        Manajemen Data Kelas
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../laporan/index.html" class="nav-link">
                        <i class="fas fa-file-alt"></i>
                        Laporan Inklusif
                    </a>
                </li>
            </ul>
        </nav>

        <div class="sidebar-footer">
            <button class="logout-btn" id="logout-btn">
                <i class="fas fa-sign-out-alt"></i>
                Logout
            </button>
        </div>
    </aside>

    <main class="main-content">
        <!-- Top Header -->
        <header class="top-header">
            <h1 class="header-title">Manajemen Kelas</h1>
            <div class="user-info">
                <div class="user-details">
                    <span class="user-name">Admin</span>
                    <span class="user-email">admin@smartedu.com</span>
                </div>
                <div class="user-avatar">
                    AD
                </div>
            </div>
        </header>
        
        <div class="content-wrapper">
            <div class="toolbar-container">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass" style="color: #94a3b8;"></i>
                    <input type="text" id="searchInput" placeholder="Cari data kelas..." onkeyup="searchData()">
                </div>
                <div class="action-buttons">
                    <button class="btn-dark" onclick="openAddModal()">
                        <i class="fas fa-plus"></i> Tambah
                    </button>
                </div>
            </div>
    
            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th width="50px">No</th>
                            <th>Nama Kelas</th>
                            <th>Guru</th>
                            <th>Jumlah Siswa</th>
                            <th>Tahun Ajaran</th>
                            <th width="120px">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Data will be loaded by JavaScript -->
                    </tbody>
                </table>
    
                <div class="pagination-container">
                    <span id="paginationInfo">Halaman 1 dari 1 Halaman</span>
                    <div class="page-numbers" id="pageNumbers">
                        <!-- Pagination will be loaded by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Add/Edit -->
    <div class="modal" id="dataModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Tambah Data Kelas</h3>
                <button class="modal-close" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="kelasForm">
                    <input type="hidden" id="kelasId">
                    
                    <div class="form-group">
                        <label for="namaKelasInput">Nama Kelas</label>
                        <input type="text" id="namaKelasInput" placeholder="Contoh: Kelas 1A" required>
                    </div>

                    <div class="form-group">
                        <label for="guruInput">Nama Guru</label>
                        <input type="text" id="guruInput" placeholder="Masukkan nama guru" required>
                    </div>

                    <div class="form-group">
                        <label for="jumlahSiswaInput">Jumlah Siswa</label>
                        <input type="number" id="jumlahSiswaInput" placeholder="0" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="tahunAjaranInput">Tahun Ajaran</label>
                        <select id="tahunAjaranInput" required>
                            <option value="">Pilih Tahun Ajaran</option>
                            <option value="2023/2024">2023/2024</option>
                            <option value="2024/2025" selected>2024/2025</option>
                            <option value="2025/2026">2025/2026</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Batal</button>
                <button class="btn btn-primary" onclick="saveData()">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        // Data statis
        let classes = [
            { id: 1, namaKelas: "Kelas 1A", guru: "Budi Santoso", jumlahSiswa: 25, tahunAjaran: "2024/2025" },
            { id: 2, namaKelas: "Kelas 2B", guru: "Siti Nurhaliza", jumlahSiswa: 28, tahunAjaran: "2024/2025" },
            { id: 3, namaKelas: "Kelas 3C", guru: "Ahmad Fauzi", jumlahSiswa: 30, tahunAjaran: "2024/2025" },
            { id: 4, namaKelas: "Kelas 4A", guru: "Dewi Lestari", jumlahSiswa: 26, tahunAjaran: "2024/2025" },
            { id: 5, namaKelas: "Kelas 5D", guru: "Heru Prasetyo", jumlahSiswa: 27, tahunAjaran: "2024/2025" },
            { id: 6, namaKelas: "Kelas 6B", guru: "Rina Wati", jumlahSiswa: 29, tahunAjaran: "2024/2025" },
        ];

        let filteredClasses = [...classes];
        let currentPage = 1;
        const itemsPerPage = 5;
        let editingId = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderTable();
        });

        // Render Table
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageData = filteredClasses.slice(startIndex, endIndex);

            if (pageData.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6">
                            <div class="empty-state">
                                <i class="fas fa-inbox"></i>
                                <p>Tidak ada data kelas</p>
                            </div>
                        </td>
                    </tr>
                `;
            } else {
                tbody.innerHTML = pageData.map((kelas, index) => `
                    <tr>
                        <td>${startIndex + index + 1}</td>
                        <td>${kelas.namaKelas}</td>
                        <td>${kelas.guru}</td>
                        <td>${kelas.jumlahSiswa}</td>
                        <td>${kelas.tahunAjaran}</td>
                        <td>
                            <div class="action-icons">
                                <i class="fa-solid fa-pen" onclick="editData(${kelas.id})" title="Edit"></i>
                                <i class="fa-solid fa-trash" onclick="deleteData(${kelas.id})" title="Hapus"></i>
                                <i class="fa-solid fa-circle-info" onclick="viewDetail(${kelas.id})" title="Detail"></i>
                            </div>
                        </td>
                    </tr>
                `).join('');
            }

            renderPagination();
        }

        // Render Pagination
        function renderPagination() {
            const totalPages = Math.ceil(filteredClasses.length / itemsPerPage);
            const paginationInfo = document.getElementById('paginationInfo');
            const pageNumbers = document.getElementById('pageNumbers');

            paginationInfo.textContent = `Halaman ${currentPage} dari ${totalPages} Halaman`;

            pageNumbers.innerHTML = Array.from({ length: totalPages }, (_, i) => i + 1)
                .map(page => `
                    <button class="page-btn ${page === currentPage ? 'active' : ''}" 
                       onclick="changePage(${page})">
                        ${page}
                    </button>
                `).join('');
        }

        // Change Page
        function changePage(page) {
            currentPage = page;
            renderTable();
        }

        // Search Data
        function searchData() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            filteredClasses = classes.filter(kelas => 
                kelas.namaKelas.toLowerCase().includes(searchTerm) ||
                kelas.guru.toLowerCase().includes(searchTerm) ||
                kelas.tahunAjaran.toLowerCase().includes(searchTerm)
            );
            currentPage = 1;
            renderTable();
        }

        // Open Add Modal
        function openAddModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Tambah Data Kelas';
            document.getElementById('kelasForm').reset();
            document.getElementById('kelasId').value = '';
            document.getElementById('tahunAjaranInput').value = '2024/2025';
            document.getElementById('dataModal').classList.add('active');
        }

        // Edit Data
        function editData(id) {
            editingId = id;
            const kelas = classes.find(k => k.id === id);
            
            document.getElementById('modalTitle').textContent = 'Edit Data Kelas';
            document.getElementById('kelasId').value = kelas.id;
            document.getElementById('namaKelasInput').value = kelas.namaKelas;
            document.getElementById('guruInput').value = kelas.guru;
            document.getElementById('jumlahSiswaInput').value = kelas.jumlahSiswa;
            document.getElementById('tahunAjaranInput').value = kelas.tahunAjaran;
            
            document.getElementById('dataModal').classList.add('active');
        }

        // Save Data
        function saveData() {
            const namaKelas = document.getElementById('namaKelasInput').value.trim();
            const guru = document.getElementById('guruInput').value.trim();
            const jumlahSiswa = parseInt(document.getElementById('jumlahSiswaInput').value);
            const tahunAjaran = document.getElementById('tahunAjaranInput').value;

            if (!namaKelas || !guru || !jumlahSiswa || !tahunAjaran) {
                alert('Harap isi semua field!');
                return;
            }

            if (jumlahSiswa < 0) {
                alert('Jumlah siswa tidak boleh negatif!');
                return;
            }

            if (editingId) {
                // Update existing
                const index = classes.findIndex(k => k.id === editingId);
                classes[index] = { id: editingId, namaKelas, guru, jumlahSiswa, tahunAjaran };
            } else {
                // Add new
                const newId = Math.max(...classes.map(k => k.id), 0) + 1;
                classes.push({ id: newId, namaKelas, guru, jumlahSiswa, tahunAjaran });
            }

            closeModal();
            searchData(); // Refresh filtered data
            renderTable();
        }

        // Delete Data
        function deleteData(id) {
            const kelas = classes.find(k => k.id === id);
            if (confirm(`Apakah Anda yakin ingin menghapus ${kelas.namaKelas}?`)) {
                classes = classes.filter(k => k.id !== id);
                searchData(); // Refresh filtered data
                renderTable();
            }
        }

        // View Detail
        function viewDetail(id) {
            const kelas = classes.find(k => k.id === id);
            alert(`Detail Kelas:\n\nNama Kelas: ${kelas.namaKelas}\nGuru: ${kelas.guru}\nJumlah Siswa: ${kelas.jumlahSiswa}\nTahun Ajaran: ${kelas.tahunAjaran}`);
        }

        // Close Modal
        function closeModal() {
            document.getElementById('dataModal').classList.remove('active');
            document.getElementById('kelasForm').reset();
            editingId = null;
        }

        // Close modal when clicking outside
        document.getElementById('dataModal').addEventListener('click', (e) => {
            if (e.target.id === 'dataModal') {
                closeModal();
            }
        });
    </script>
</body>
</html>
