<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Orang Tua</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../sidebar.css">
    <link rel="stylesheet" href="ortu.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">SmartEduInclusion</div>
            <div class="logo-subtitle">Student Portal</div>
        </div>

        <nav class="sidebar-nav">
            <ul class="nav-list">
                <li class="nav-item">
                    <a href="#" class="nav-link active">
                        <i class="fas fa-home"></i>
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="../komunikasi/list.html" class="nav-link">
                        <i class="fas fa-comments"></i>
                        Komunikasi
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <i class="fas fa-seedling"></i>
                        Perkembangan Anak
                    </a>
                </li>
            </ul>
        </nav>

        <div class="sidebar-footer">
            <button class="logout-btn" id="logout-btn">
                <i class="fas fa-sign-out-alt"></i>
                Logout
            </button>
        </div>
    </aside>

    <main class="main-content">
        <!-- Top Header -->
        <header class="top-header">
            <h1 class="header-title">Dashboard</h1>
            <div class="user-info">
                <div class="user-details">
                    <span class="user-name">Orang Tua</span>
                    <span class="user-email">email@example.com</span>
                </div>
                <div class="user-avatar">
                    OT
                </div>
            </div>
        </header>
        <div class="content-wrapper">
            <p>Nama Siswa: <strong>Alif</strong></p>
    
            <div class="stats-grid">
                <div class="card-stat behavior-card">
                    <h3>Skor Perilaku</h3>
                    <div class="score">A+</div>
                </div>
                <div class="card-stat graph-card">
                    <h3>Grafik Nilai</h3>
                    <div class="chart-box">
                        <canvas id="myChart"></canvas>
                    </div>
                </div>
            </div>
    
            <section class="remedial-section">
                <h3>Riwayat Remedial</h3>
                <table class="remedial-table">
                    <thead>
                        <tr>
                            <th>Mata Pelajaran</th>
                            <th>Awal</th>
                            <th>Akhir</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Matematika</td>
                            <td>65</td>
                            <td>80</td>
                            <td>Lulus</td>
                        </tr>
                        <tr>
                            <td>Fisika</td>
                            <td>60</td>
                            <td>75</td>
                            <td>Lulus</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </div>
    </main>

    <script>
        const btn = document.getElementById('logout-btn');
        btn.addEventListener('click', function(){
            window.location.href = "../../index.html";
        });

        new Chart('myChart', {
            type: 'bar',
            data: {
                labels: ['Kimia', 'Matematika', 'Fisika', 'Biologi'],
                datasets: [{
                    label: 'Nilai',
                    data: [88, 80, 75, 90],
                    backgroundColor: '#2563EB',
                }]
            },
            options: { maintainAspectRatio: false }
        });
    </script>
</body>

</html>
